services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: github_i18n
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    command: node server.js
    environment:
      PORT: "3123"
    env_file: .env
    ports:
      - "3123:3123"
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: npm run worker:prod
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
